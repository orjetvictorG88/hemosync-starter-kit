<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Noto Sans",system-ui,sans-serif;transition:background .5s,color .5s;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 18px 90px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.logo{display:flex;align-items:center;gap:8px;font:700 20px Poppins,Inter,sans-serif;color:var(--brand);flex:1;cursor:pointer}
.logo svg{animation:beat 1.6s infinite}@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}36%{transform:scale(1.1)}}
.ic{min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;box-shadow:var(--sh)}
.chain{border-radius:999px;padding:0 12px;min-width:0;font-size:12px}.chain.ok{color:var(--teal)}.chain.bad{color:#fff;background:var(--stop);border-color:var(--stop)}
h1,h2{font-family:Poppins,Inter,sans-serif;margin:0}h1{font-size:30px;line-height:1.15}h2{font-size:22px}
.sub{color:var(--mute);margin:6px 0 18px}
.in{animation:up .5s cubic-bezier(.34,1.4,.64,1)}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.role{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.role:active{transform:scale(.97)}.role.off{opacity:.45;cursor:default}
.av{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 19px Poppins,sans-serif}
.role b{display:block;font-size:18px}.role span{color:var(--mute);font-size:14px}.role i{display:block;font-size:13px;color:var(--brand);margin-top:2px}
.btn{width:100%;min-height:56px;border-radius:18px;border:0;font:700 17px Inter,sans-serif;cursor:pointer;color:#fff;background:var(--brand);transition:transform .2s cubic-bezier(.34,1.56,.64,1);margin-top:8px}
.btn:active{transform:scale(.97)}.btn.t{background:#0E8F7E}.btn.g{background:var(--line);color:var(--mute);cursor:default}.btn.l{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.big{min-height:84px;font-size:22px;border-radius:26px;background:linear-gradient(160deg,#D8381E,#8E1230);box-shadow:0 10px 30px #d8381e55;animation:glow 2.4s infinite}@keyframes glow{50%{box-shadow:0 10px 44px #d8381e99}}
.pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.pr svg{flex:0 0 38px}.pr small{color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.dot{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:#B7ADBA;transition:all .5s}.dot.ok{background:#0E8F7E}.dot.wait{background:#E8A317}
.row b{flex:1;font-weight:600}.row em{font-style:normal;font-size:13px;color:var(--mute)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}.chip.g{background:var(--tealbg);color:var(--teal)}.chip.n{background:#FBE0DA;color:#B02A12}.chip.v{background:var(--violbg);color:var(--viol)}.chip.a{background:var(--amberbg);color:var(--amber)}
.unit{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}.unit.d{opacity:.9}
.gt{font:700 26px Poppins,sans-serif;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--violbg);color:var(--viol)}
.ring{display:grid;place-items:center;position:relative;margin:6px auto 12px;width:150px}.ring div{position:absolute;text-align:center}.ring b{font:700 30px Poppins,sans-serif;display:block}
.stop{position:fixed;inset:0;background:#D8381E;color:#fff;z-index:9;display:flex;flex-direction:column;justify-content:center;padding:28px;animation:shake .5s}@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.stop h1{font-size:34px;margin:8px 0 10px}.stop .btn{background:#fff;color:#8E1230}

.sheet{position:fixed;inset:auto 0 0 0;max-height:78vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px;z-index:7;box-shadow:0 -10px 40px #0005;animation:up .4s;max-width:520px;margin:0 auto}
.hx{font:12px ui-monospace,Menlo,monospace;color:var(--mute);padding:7px 0;border-top:1px solid var(--line);word-break:break-all}.hx b{color:var(--ink)}.hx.bad{background:#d8381e22}
.msg{border-radius:18px;padding:14px;background:var(--tealbg);color:var(--teal);font-weight:600;margin-bottom:12px}
.ft{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:10px}
.gift{background:linear-gradient(160deg,#6B0F2A,#C8102E);color:#fff;border-radius:26px;padding:24px;margin-bottom:14px;box-shadow:0 14px 40px #c8102e44;animation:up .9s cubic-bezier(.34,1.4,.64,1)}.gift h2{font-size:26px;line-height:1.25;margin:6px 0 14px}.gift p{margin:0 0 12px;font-size:17px;line-height:1.55}.gift small{opacity:.85}.gift .k{font-size:12px;letter-spacing:.12em;font-weight:700;opacity:.85}
.tl{display:flex;gap:12px;padding:12px 6px;border-top:1px solid var(--line)}.tl.bad{background:#d8381e22;border-radius:12px}.fh{font:11px ui-monospace,Menlo,monospace;background:var(--bg);border-radius:10px;padding:8px;overflow:auto;margin:4px 0 0;max-height:170px;color:var(--mute)}

const $=s=>document.querySelector(s),enc=new TextEncoder(),Z='0'.repeat(64);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');

const hr=new Date().getHours(),night=hr>=19||hr<6;

const abo=g=>g.replace(/[+-]/,''),pos=g=>g.endsWith('+'),ok=(d,r)=>{const a=abo(d),b=abo(r);return(a==='O'||a===b||b==='AB')&&(!pos(d)||pos(r))};
const seed=()=>({units:[{id:'4821',g:'O+',exp:6,st:'Q',sigs:[]},{id:'3302',g:'O-',exp:20,st:'R'},{id:'3303',g:'A+',exp:5,st:'R'},{id:'3304',g:'B+',exp:9,st:'R'}],ledger:[],pt:'O+',wrist:false,n2:false});
function save(){if(S.off)S.q=(S.q||0)+1;try{localStorage.setItem('hl1',JSON.stringify(S))}catch(e){}if(!S.off&&REF)push()}
async function log(e,id,a){const p=S.ledger.length?S.ledger.at(-1).h:Z,x={seq:S.ledger.length+1,t:e,u:id,a,ts:new Date().toISOString().slice(11,19),p};x.h=await sha(p+JSON.stringify([x.seq,x.t,x.u,x.a,x.ts]));S.ledger.push(x)}
async function verify(){let p=Z;for(const e of S.ledger){if(e.p!==p||await sha(p+JSON.stringify([e.seq,e.t,e.u,e.a,e.ts]))!==e.h)return e.seq;p=e.h}return 0}
async function fresh(){S=seed();await log('UnitCollected','4821','phleb.otieno');await log('TestResultRecorded','4821','tech.brian');for(const u of S.units.slice(1))await log('UnitReleased',u.id,'seed')}
const U=id=>S.units.find(u=>u.id==id),mine=()=>U('4821'),act=async f=>{msg=null;await f();save();draw()};

const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

const drop=(n,sz=38)=>{const y=40-(n/7)*34;return `<svg width="${sz}" height="${sz}" viewBox="0 0 32 40"><defs><clipPath id="c${n}"><rect x="0" y="${y}" width="32" height="40"/></clipPath></defs><path d="M16 2C16 2 4 17 4 25a12 12 0 0024 0C28 17 16 2 16 2z" fill="none" stroke="#C8102E" stroke-width="2"/><path d="M16 2C16 2 4 17 4 25a12 12 0 0024 0C28 17 16 2 16 2z" fill="#C8102E" clip-path="url(#c${n})" style="transition:all 1s"/></svg>`};

const trs=s=>SW.reduce((a,[r,x])=>a.replace(r,x),s);
function trDom(sel){const w=document.createTreeWalker($(sel),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=n.nodeValue;if(v.trim()){const r=trs(v);if(r!==v)n.nodeValue=r}}}
function draw(){
document.documentElement.dataset.theme=S.theme||(night?'dark':'light');
$('#top').innerHTML=`<div class="logo" onclick="view='home';list=false;draw()"><svg width="26" height="32" viewBox="0 0 32 40"><path d="M16 2C16 2 4 17 4 25a12 12 0 0024 0C28 17 16 2 16 2z" fill="#C8102E"/></svg>HemoSync</div><button class="ic" onclick="setLang()">${lang=='en'?'SW':'EN'}</button><button class="ic" onclick="act(()=>{S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'})">☾</button><button class="ic" id="wf" onclick="toggleOff()" aria-label="Wi-Fi">${S.off?'✈︎':'●'}</button><button class="ic chain" id="ch" onclick="sheet=true;draw()">…</button>`;
let h=S.off?`<div class="msg" style="background:var(--violbg);color:var(--viol)">${L('Saved on this device · ','Imehifadhiwa kwenye kifaa hiki · ')}${S.q||0} ${L('events waiting to sync','matukio yanasubiri kusawazishwa')}</div>`:'';
if(view=='home'){h+=`<div class="in"><p class="sub" style="margin:10px 0 2px">${greet()}.</p><h1>${t('who')}</h1><p class="sub">${t('pick')}</p>${['achieng','brian','wanjiru','mercy','hassan','njeri'].map(k=>{const p=PE[k];return `<button class="card role" onclick="view='${k}';draw()"><div class="av" style="background:${p[1]}">${p[0]}</div><div><b>${p[2]}</b><span>${p[3]}</span><i>${p[4]}</i></div></button>`}).join('')}${OFF.map(p=>`<div class="card role off"><div class="av" style="background:${p[1]}">${p[0]}</div><div><b>${p[2]}</b><span>${p[3]} · ${t('soon')}</span></div></div>`).join('')}<p class="sub" style="font-size:14px">Try this: be Brian and release the unit. Be Achieng and use it. Then be Wanjiru.</p></div>`}

const EV={UnitCollected:['was collected and locked in quarantine','ulikusanywa na kuwekwa karantini','#E8A317'],TestResultRecorded:['test results were recorded','matokeo ya vipimo yamerekodiwa','#E8A317'],UnitReleased:['was released to the shelf','umewekwa rafuni','#0E8F7E'],UnitReserved:['was matched to a patient','umelinganishwa na mgonjwa','#6A4FB3'],UnitIssued:['was issued from the fridge','umetolewa kwenye friji','#6A4FB3'],TransfusionStarted:['transfusion started','utiaji damu umeanza','#0E8F7E'],UnitDiscarded:['was discarded for safety','umetupwa kwa usalama','#D8381E'],CustodyTransferred:['changed hands','kimebadilisha mikono','#0E8F7E'],TemperatureExcursionFlagged:['got too warm. Units are on hold','kilipata joto sana. Mifuko iko HOLD','#D8381E'],AdverseEventReported:['adverse event reported','tukio baya limeripotiwa','#D8381E']};
const FH={UnitCollected:'BiologicallyDerivedProduct',TestResultRecorded:'Observation',UnitReleased:'BiologicallyDerivedProduct',UnitDiscarded:'BiologicallyDerivedProduct',CustodyTransferred:'Task',TemperatureExcursionFlagged:'DetectedIssue',UnitReserved:'ServiceRequest',UnitIssued:'Task',UnitReturned:'Task',TransfusionStarted:'Procedure',AdverseEventReported:'AdverseEvent',DonorScreened:'QuestionnaireResponse'};
const fhir=e=>JSON.stringify({resourceType:FH[e.t]||'Basic',id:'hs-'+e.seq,identifier:[{system:'urn:hemosync:unit',value:e.u}],meta:{tag:[{code:e.t}]},time:e.ts,agent:e.a,note:'Proposed mapping, not validated'},null,1);
async function copyFhir(){const b={resourceType:'Bundle',type:'collection',entry:S.ledger.map(e=>({resource:JSON.parse(fhir(e))}))};try{await navigator.clipboard.writeText(JSON.stringify(b,null,1));toast(L('FHIR bundle copied: '+S.ledger.length+' events.','Kifurushi cha FHIR kimenakiliwa: matukio '+S.ledger.length+'.'))}catch(e){toast(L('Could not copy here. Open details on any event to read its FHIR.','Imeshindwa kunakili hapa. Fungua maelezo ya tukio lolote kuona FHIR yake.'))}}
function ledgerHTML(){return `<div class="sheet"><div style="display:flex;align-items:center"><h2 style="flex:1">${L('The record','Kumbukumbu')}</h2><button class="ic" onclick="sheet=false;draw()" aria-label="Close">✕</button></div><div id="lstat" class="msg" style="margin:12px 0">…</div><p class="sub" style="margin:0 0 6px;font-size:14px">${L('Every step is written down once and linked to the one before it. Nothing can be quietly changed.','Kila hatua huandikwa mara moja na kuunganishwa na iliyotangulia. Hakuna kinachoweza kubadilishwa kimya kimya.')}</p>${S.ledger.slice().reverse().map(e=>{const v=EV[e.t]||['recorded','imerekodiwa','#8A8190'],sb=e.u[0]=='C'?L('Cooler ','Kisanduku ')+e.u:L('Unit …','Mfuko …')+e.u;return `<div class="tl" id="e${e.seq}"><div class="dot" style="background:${v[2]};margin-top:2px">${e.seq}</div><div style="flex:1;min-width:0"><b>${sb} ${L(v[0],v[1])}</b><br><small style="color:var(--mute)">${e.ts} · ${e.a}</small><details><summary style="cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0">${L('Details','Maelezo')}</summary><div class="hx" style="border:0;padding:0 0 6px">${L('Fingerprint','Alama')}: ${e.h.slice(0,16)}…<br>${L('Linked to','Imeunganishwa na')}: ${e.p.slice(0,16)}…</div><pre class="fh">${fhir(e)}</pre></details></div></div>`}).join('')}<div style="display:grid;gap:8px;margin-top:14px"><button class="btn t" style="min-height:48px;font-size:15px" onclick="copyFhir()">${L('Copy as FHIR bundle','Nakili kama kifurushi cha FHIR')}</button><button class="btn l" style="min-height:48px;font-size:14px" onclick="act(async()=>{S.ledger[Math.min(2,S.ledger.length-1)].a='someone.else';toast(L('Event #3 was quietly edited.','Tukio #3 lilihaririwa kimya kimya.'))})">${L('Try to edit event #3 (demo)','Jaribu kuhariri tukio #3 (onyesho)')}</button><button class="btn l" style="min-height:48px;font-size:14px" onclick="act(async()=>{view='home';list=false;sheet=false;await fresh()})">${L('Reset the story','Anza hadithi upya')}</button></div></div>`}
async function sign(w){const u=mine();if(u.sigs.includes(w)){toast('Gate 4: the same person cannot sign twice. Please pass the tablet.');buzz([60,40,60]);return}u.sigs.push(w);if(u.sigs.length==2){u.st='R';await log('UnitReleased','4821',u.sigs.join('+'));buzz(40);toast('Two signatures. …4821 is released to the shelf.')}}
async function pick(id){const u=U(id);list=false;if(!ok(u.g,S.pt)){const sug=S.units.filter(x=>x.st=='R'&&ok(x.g,S.pt)).sort((a,b)=>a.exp-b.exp)[0];stop={g:u.g,sug};buzz([120,60,120]);list=true;return}u.st='V';await log('UnitReserved',id,'tech.joy');buzz(30)}
async function issue(id){const u=U(id);u.st='I';u.t0=Date.now();S.wrist=false;S.n2=false;await log('UnitIssued',id,'store.mercy')}
async function go(id){const u=U(id),m=(Date.now()-u.t0)/60000;if(m>30){u.st='D';await log('UnitDiscarded',id,'system');S.done=1;toast('Gate 7: over 30 minutes out of the fridge. The unit is discarded for safety.');return}u.st='T';S.done=1;await log('TransfusionStarted',id,'nurse.achieng+mercy');buzz([40,30,40]);toast('Transfusion started.')}
setInterval(()=>{if(view!='achieng'||!S)return;const a=active();if(!a||a.st!='I')return;const r=Math.max(0,1800-Math.floor((Date.now()-a.t0)/1000)),e=$('#tm'),g=$('#rg');if(!e)return;e.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');g.style.strokeDashoffset=339.3*(1-r/1800);g.style.stroke=r<300?'#D8381E':'#E8A317'},1000);
(async()=>{try{S=JSON.parse(localStorage.getItem('hl1'))}catch(e){}if(!S||!S.units)await fresh();lang=S.lang||'en';draw();initShared()})();
addEventListener('offline',()=>{if(S&&!S.off){S.off=true;draw()}});addEventListener('online',()=>{if(S&&S.off)toggleOff()});
</script></body></html>
